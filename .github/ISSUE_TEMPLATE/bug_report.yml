name: Bug report
description: Report something that isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Scan '...'
        3. See error
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device / browser
      description: Camera scanning and hardware-scanner detection are device-dependent — this matters a lot for scanner bugs.
      placeholder: e.g. iPhone 13, Safari 17
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Console errors / screenshots
      render: shell